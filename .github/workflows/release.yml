name: Publier une version

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Version à publier (ex. v1.0.1)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Tests
        run: dotnet test tests/Files7734.Tests -c Release

      - name: Compilation (un seul .exe)
        run: >
          dotnet publish src/Files7734.App -c Release -r win-x64 --self-contained
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true -p:DebugType=none -o publish

      - name: Publication sur GitHub
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          notes="docs/notes/${TAG}.md"
          if [ -f "$notes" ]; then
            gh release create "$TAG" publish/7734FilesChecker.exe --target "$GITHUB_SHA" --title "7734 Files Checker ${TAG#v}" --notes-file "$notes"
          else
            gh release create "$TAG" publish/7734FilesChecker.exe --target "$GITHUB_SHA" --title "7734 Files Checker ${TAG#v}" --generate-notes
          fi
